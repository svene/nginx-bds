<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Baloise Design System Demos</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@baloise/ds-styles/css/all.css" />
	<script type="module" src="https://cdn.jsdelivr.net/npm/@baloise/ds-core/dist/baloise-design-system/baloise-design-system.esm.js"></script>
	<script nomodule src="https://cdn.jsdelivr.net/npm/@baloise/ds-core/dist/baloise-design-system/baloise-design-system.js"></script>
<!--	<script src="https://unpkg.com/htmx.org@2.0.4"></script>-->
	<script src="lib/htmx/2.0.4/htmx.js"></script>
	<script src="https://unpkg.com/sinon@19.0.2/pkg/sinon.js"></script>
	<script src="main.js" type="module" defer></script>
</head>
<body>
<bal-app>
	<main class="container mt-xx-large">
		<bal-heading>Use Case: search, list, next-icon to details-list</bal-heading>
		<bal-card>
			<bal-card-content>
				<form>
					<div class="field">
						<label class="label">Name</label>
						<div class="control">
							<input class="input"
								   name="searchvalue"
								   hx-trigger="input changed delay:500ms, keyup[key=='Enter']"
								   hx-post="/searchadvisor"
								   hx-target="#search-result"
								   hx-swap="innerHtml"
							>
						</div>
					</div>
				</form>

				<!-- Search Results: -->
				<bal-list id="search-result"></bal-list>



			</bal-card-content>
		</bal-card>
	</main>
</bal-app>


</body>
</html>
