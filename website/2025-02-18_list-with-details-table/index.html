<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Baloise Design System Demos</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@baloise/ds-styles/css/all.css" />
	<script type="module" src="https://cdn.jsdelivr.net/npm/@baloise/ds-core/dist/baloise-design-system/baloise-design-system.esm.js"></script>
	<script nomodule src="https://cdn.jsdelivr.net/npm/@baloise/ds-core/dist/baloise-design-system/baloise-design-system.js"></script>
</head>
<body>
<bal-app>
	<main class="container mt-xx-large">
		<bal-heading>Use Case: search, list, details-list </bal-heading>
		<bal-card>
			<bal-card-content>
				<bal-form>
					<bal-field>
						<bal-field-label>Advisor-Search</bal-field-label>
						<bal-field-control>
							<bal-input placeholder="Placeholder"></bal-input>
						</bal-field-control>
					</bal-field>
				</bal-form>

				<!-- Search Results: -->
				<bal-list border="true" accordion-one-level="true">
					<bal-list-item accordion="true">
						<bal-list-item-accordion-head icon="nav-go-down">
							<bal-list-item-content>
								<bal-list-item-title level="x-large">Advisor 1</bal-list-item-title>
							</bal-list-item-content>
						</bal-list-item-accordion-head>
						<bal-list-item-accordion-body>
							<table class="table w-full is-striped is-hoverable p-none">
								<thead><tr><th>DocumentNr</th><th>DokumentName</th></tr></thead>
								<tbody>
									<tr><td>1</td><td>Dokument A</td></tr>
									<tr><td>2</td><td>Dokument B</td></tr>
								</tbody>
							</table>
						</bal-list-item-accordion-body>
					</bal-list-item>

					<bal-list-item accordion="true">
						<bal-list-item-accordion-head icon="nav-go-down">
							<bal-list-item-content>
								<bal-list-item-title level="x-large">Advisor 2</bal-list-item-title>
							</bal-list-item-content>
						</bal-list-item-accordion-head>
						<bal-list-item-accordion-body>
							<table class="table w-full is-striped is-hoverable p-none">
								<thead><tr><th>DocumentNr</th><th>DokumentName</th></tr></thead>
								<tbody>
								<tr><td>1</td><td>Dokument A</td></tr>
								<tr><td>2</td><td>Dokument B</td></tr>
								</tbody>
							</table>
						</bal-list-item-accordion-body>
					</bal-list-item>

				</bal-list>


			</bal-card-content>
		</bal-card>
	</main>
</bal-app>


</body>
</html>
